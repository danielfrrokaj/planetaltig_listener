<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Listener Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-link-container">
    <a href="summary.html" class="nav-link">Go to Shift Summary →</a>
  </div>

  <h1>Website Listener</h1>
  
  <h2>Search Clicks (Last 6h)</h2>
  <div class="dashboard-container">
    <div class="stat-card" id="clicksLastHour">
      <span>Last 1 hour:</span> <span class="stat-value">0</span>
    </div>
    <div class="stat-card" id="clicksLast3Hours">
      <span>Last 3 hours:</span> <span class="stat-value">0</span>
    </div>
    <div class="stat-card" id="clicksLast6Hours">
      <span>Last 6 hours:</span> <span class="stat-value">0</span>
    </div>
  </div>

  <h2>Productivity</h2>
  <div class="dashboard-container">
    <div class="stat-card" id="pickupRate">
      <span>Pickup Success Rate:</span> <span class="stat-value">N/A</span>
    </div>
    <div class="stat-card" id="appointmentRate">
      <span>Appointment Success Rate:</span> <span class="stat-value">N/A</span>
    </div>
  </div>

  <h2>Add Pickup Note</h2>
  <div class="note-form-container">
    <textarea id="pickupNoteInput" placeholder="Add pickup notes..." rows="3"></textarea>
    <div class="appointment-toggle">
      <input type="checkbox" id="isAppointmentCheckbox">
      <label for="isAppointmentCheckbox">Is Appointment?</label>
    </div>
    <button id="saveNoteButton">Save Note</button>
  </div>

  <h2>Recent Pickups</h2>
  <div id="pickupNotesList" class="notes-list">
    <p class="no-notes">No pickups recorded yet.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
