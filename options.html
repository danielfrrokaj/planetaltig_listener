<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-link-container">
    <a href="popup.html" class="nav-link">← Back to Dashboard</a>
  </div>

  <h1>Profile Settings</h1>
  
  <div class="note-form-container">
    <p id="usernameDisplay">Username: Loading...</p>
    
    <label for="firstNameInput">First Name</label>
    <input type="text" id="firstNameInput" placeholder="Enter first name">

    <label for="lastNameInput">Last Name</label>
    <input type="text" id="lastNameInput" placeholder="Enter last name">

    <label for="avatarUrlInput">Avatar URL</label>
    <input type="text" id="avatarUrlInput" placeholder="Enter avatar URL">

    <button id="saveProfileButton">Save Profile</button>
    <p id="statusMessage" class="status-message"></p>
  </div>

  <script src="supabase_auth.js"></script>
  <script src="supabase_api.js"></script>
  <script src="options.js"></script>
</body>
</html>
