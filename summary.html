<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shift Summary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-link-container">
    <a href="popup.html" class="nav-link">← Back to Dashboard</a>
  </div>
  
  <h1>Shift Summary</h1>

  <div class="note-form-container">
    <p>This summary uses the total search clicks (last 6 hours) and all recorded pickups.</p>
    
    <div class="shift-input-group">
        <label for="callerNameInput">Caller Name:</label>
        <select id="callerNameInput">
            <option value="caller1">Caller 1</option>
            <option value="caller2">Caller 2</option>
            <option value="caller3">Caller 3</option>
        </select>
    </div>
    
    <div class="shift-input-group">
        <label for="workingHoursInput">Working Hours:</label>
        <input type="text" id="workingHoursInput" placeholder="e.g., 9:00 - 17:00">
    </div>
    <div class="shift-input-group">
        <label for="callCountInput">Total Calls:</label>
        <input type="number" id="callCountInput" placeholder="e.g., 360" value="0">
    </div>
    <button id="endShiftButton">Generate Shift Summary</button>
    <button id="submitReportButton" style="background-color: #28a745;">Submit Report</button>
    <textarea id="summaryOutput" rows="10" readonly placeholder="Summary will appear here..."></textarea>
  </div>

  <!-- Load necessary scripts -->
  <script src="shift_summary.js"></script>
  <script src="supabase_api.js"></script>
  <script src="summary.js"></script>
</body>
</html>
